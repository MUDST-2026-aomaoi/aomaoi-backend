name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  INGRESS_NGINX_MANIFEST: https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/cloud/deploy.yaml

jobs:
  # ========================================================
  # Stage 1: unit tests + manifest validation
  # ========================================================
  test:
    name: Unit tests and manifest rendering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean test -B

      - name: Shell scripts parse
        run: |
          bash -n scripts/k8s-deploy.sh
          bash -n scripts/k8s-smoke.sh

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s > /tmp/aomaoi.yaml
          kubectl kustomize k8s/migrate > /tmp/aomaoi-migrate.yaml
          test -s /tmp/aomaoi.yaml
          test -s /tmp/aomaoi-migrate.yaml

  # ========================================================
  # Stage 2: build the image; push to GHCR except on pull requests
  # ========================================================
  build:
    name: Build image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Image names
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          repo="$REGISTRY/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/aomaoi-backend"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$SHA" >> "$GITHUB_OUTPUT"
          # Only the immutable SHA tag is deployed; branch tags are a convenience for humans.
          branch_tag="$(printf '%s' "$REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          if [ "$REF_NAME" = "main" ]; then branch_tag=latest; fi
          echo "branch_tag=$repo:$branch_tag" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "pull_request" ]; then echo "push=false" >> "$GITHUB_OUTPUT"; else echo "push=true" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.branch_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to GHCR (not on pull requests)
        if: steps.meta.outputs.push == 'true'
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.branch_tag }}"

      - name: Save image for the cluster test
        run: docker save "${{ steps.meta.outputs.image }}" -o /tmp/backend-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          retention-days: 1

  # ========================================================
  # Stage 3: prove the manifests work - deploy to a throwaway kind cluster and smoke test.
  # Needs no secrets and no access to anybody's cluster.
  # ========================================================
  deploy-kind:
    name: Deploy to kind and smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: aomaoi
          version: v0.22.0
          kubectl_version: v1.29.3

      - name: Install ingress-nginx
        run: |
          kubectl apply -f "$INGRESS_NGINX_MANIFEST"
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=240s
          kubectl -n ingress-nginx wait --for=condition=complete job/ingress-nginx-admission-create job/ingress-nginx-admission-patch --timeout=120s

      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: backend-image
          path: /tmp

      - name: Load image into kind
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          docker load -i /tmp/backend-image.tar
          kind load docker-image "$IMAGE" --name aomaoi

      - name: Deploy (PostgreSQL, migration Job, backend, Ingress)
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.image }}
        run: scripts/k8s-deploy.sh

      - name: Smoke test through the Ingress
        run: |
          kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 16969:80 >/tmp/port-forward.log 2>&1 &
          sleep 5
          scripts/k8s-smoke.sh

      - name: Backend recovers after Pod deletion
        run: |
          kubectl -n aomaoi-app delete pod -l app=aomaoi-backend
          kubectl -n aomaoi-app rollout status deployment/aomaoi-backend --timeout=180s
          scripts/k8s-smoke.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all,ingress,pvc -A || true
          kubectl -n aomaoi-app describe pods || true
          kubectl -n aomaoi-app logs -l app=aomaoi-backend --tail=200 --all-containers || true
          kubectl -n aomaoi-app logs job/aomaoi-migrate --all-containers --tail=200 || true

  # ========================================================
  # Stage 4: real deployment. Runs only on main (or manually) when cluster
  # access is configured; forks stay green.
  #   Secret   KUBE_CONFIG       base64 of a kubeconfig that can reach the target cluster
  #   Variable KUBE_NAMESPACE    optional, default aomaoi-app
  #   Variable INGRESS_CLASS     optional, default nginx
  #   Variable DEPLOY_RUNNER     optional runner label, default ubuntu-24.04 (use a self-hosted
  #                              runner label when the cluster is not reachable from the internet)
  # The GHCR package must be public, or the cluster needs a `ghcr-pull` pull secret.
  # ========================================================
  deploy:
    name: Deploy to cluster
    needs: [build, deploy-kind]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    environment: production
    concurrency:
      group: aomaoi-backend-deploy
      cancel-in-progress: false
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - name: Check deployment target
        id: target
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No KUBE_CONFIG secret configured; skipping real deployment (the kind deployment above already passed)."
          fi

      - uses: actions/checkout@v5
        if: steps.target.outputs.enabled == 'true'

      - name: Configure kubectl
        if: steps.target.outputs.enabled == 'true'
        run: |
          umask 077
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy exact image
        if: steps.target.outputs.enabled == 'true'
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.image }}
          NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'aomaoi-app' }}
          INGRESS_CLASS: ${{ vars.INGRESS_CLASS || 'nginx' }}
        run: scripts/k8s-deploy.sh

      - name: Remove kubeconfig
        if: always() && steps.target.outputs.enabled == 'true'
        run: rm -f "$RUNNER_TEMP/kubeconfig"

  # ========================================================
  # Stage 4b: Render. Every push/merge to main that passes tests, the image build and the
  # kind smoke test redeploys exactly that commit on Render; forks without the secret stay green.
  #   Secret RENDER_DEPLOY_HOOK_URL  Render service > Settings > Deploy Hook
  #   Secret RENDER_API_KEY          optional; when set, the job waits until the deploy is live
  #                                  and fails if Render's build or health check fails
  # Set the Render service's Auto-Deploy to "Off" so untested commits are not deployed
  # and each commit is not deployed twice.
  # ========================================================
  deploy-render:
    name: Deploy to Render
    needs: [build, deploy-kind]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: aomaoi-backend-render-deploy
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Trigger Render deploy of this commit
        id: trigger
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::No RENDER_DEPLOY_HOOK_URL secret configured; skipping Render deployment."
            exit 0
          fi
          # The hook URL already carries ?key=...; ref pins the deploy to the commit that passed CI.
          response="$(curl -fsS --retry 3 -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")"
          deploy_id="$(printf '%s' "$response" | jq -r '.deploy.id // empty')"
          service_id="$(printf '%s' "$RENDER_DEPLOY_HOOK_URL" | sed -n 's#.*/deploy/\(srv-[^?/]*\).*#\1#p')"
          echo "Render deploy ${deploy_id:-<unknown id>} started for commit $GITHUB_SHA"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "service_id=$service_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deploy to go live
        if: steps.trigger.outputs.deploy_id != '' && steps.trigger.outputs.service_id != '' && env.RENDER_API_KEY != ''
        env:
          SERVICE_ID: ${{ steps.trigger.outputs.service_id }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          # Render builds the Docker image itself and the JVM starts slowly on small instances.
          for _ in $(seq 1 100); do
            status="$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" | jq -r '.status' || echo unknown)"
            echo "Render deploy $DEPLOY_ID: $status"
            case "$status" in
              live) exit 0 ;;
              *failed|canceled|deactivated)
                echo "::error::Render deploy $DEPLOY_ID ended with status $status"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for Render deploy $DEPLOY_ID"
          exit 1
