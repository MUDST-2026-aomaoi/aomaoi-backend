name: Database Migration CI Check

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'src/main/resources/db/changelog/**'
      - 'src/test/java/com/aomaoi/backend/migration/**'
      - 'src/main/java/com/aomaoi/backend/entity/**'
      - 'src/main/resources/application.properties'
      - 'pom.xml'
      - '.github/workflows/db-migration-ci.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'src/main/resources/db/changelog/**'
      - 'src/test/java/com/aomaoi/backend/migration/**'
      - 'src/main/java/com/aomaoi/backend/entity/**'
      - 'src/main/resources/application.properties'
      - 'pom.xml'
      - '.github/workflows/db-migration-ci.yml'

jobs:
  validate-and-test-migration:
    name: Validate and Test Liquibase Migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aomaoi_db
          POSTGRES_USER: aomaoi_user
          POSTGRES_PASSWORD: aomaoi_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aomaoi_user -d aomaoi_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test PostgreSQL schema, rollback, and Hibernate validation
        env:
          AOMAOI_MIGRATION_TEST_URL: jdbc:postgresql://localhost:5432/aomaoi_db
          AOMAOI_MIGRATION_TEST_USER: aomaoi_user
          AOMAOI_MIGRATION_TEST_PASSWORD: aomaoi_password
        run: |
          chmod +x mvnw
          ./mvnw -Dtest=PostgreSqlMigrationIntegrationTest test

      - name: Report Success
        run: echo "Spring Liquibase changelog migration tests passed."
