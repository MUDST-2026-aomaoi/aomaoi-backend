name: aomaoi

services:
  app:
    build: .
    container_name: aomaoi-app
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      SPRING_LIQUIBASE_ENABLED: "true"
    restart: unless-stopped

  frontend:
    build:
      context: ../aomaoi-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8081/api
    container_name: aomaoi-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - app
    restart: unless-stopped
