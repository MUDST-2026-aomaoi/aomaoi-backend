services:
  app:
    build: .
    container_name: aomaoi-app
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-aomaoi_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-aomaoi_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-aomaoi_password}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: aomaoi-postgres
    ports:
      - "5434:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-aomaoi_db}
      POSTGRES_USER: ${DB_USER:-aomaoi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aomaoi_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aomaoi-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  frontend:
    build: ../aomaoi-frontend
    container_name: aomaoi-frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
