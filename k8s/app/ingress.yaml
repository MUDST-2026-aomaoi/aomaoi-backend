# localhost/aomaoi-api (or localhost:16969/aomaoi-api when port-forwarding the controller).
# No rewrite: the backend itself serves under the /aomaoi-api context path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aomaoi-backend
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /aomaoi-api
            pathType: Prefix
            backend:
              service:
                name: aomaoi-backend
                port:
                  number: 8080
