# Runs Liquibase + seed once, then exits (MigrationJobRunner). Jobs are immutable, so
# scripts/k8s-deploy.sh deletes the previous run before applying this one.
apiVersion: batch/v1
kind: Job
metadata:
  name: aomaoi-migrate
  labels:
    app: aomaoi-migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: aomaoi-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command: [sh, -ec, 'until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d aomaoi_db; do sleep 2; done']
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aomaoi-secrets
                  key: database-user
      containers:
        - name: migrate
          image: ghcr.io/mudst-2026-aomaoi/aomaoi-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: aomaoi-backend-config
          env:
            - name: SPRING_LIQUIBASE_ENABLED
              value: "true"
            - name: APP_SEED_ENABLED
              value: "true"
            - name: APP_MIGRATION_JOB
              value: "true"
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aomaoi-secrets
                  key: bootstrap-admin-password
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aomaoi-secrets
                  key: database-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aomaoi-secrets
                  key: database-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aomaoi-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 768Mi
