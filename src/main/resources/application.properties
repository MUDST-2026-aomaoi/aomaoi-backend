# Server Port
server.port=8080

# PostgreSQL Database Configuration (Matches docker-compose.yml)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/aomaoi_db
spring.datasource.username=aomaoi_user
spring.datasource.password=aomaoi_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Configuration
# 'update' keeps your data safe — only adds new columns if needed
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Redis Configuration (Matches docker-compose.yml)
spring.data.redis.host=localhost
spring.data.redis.port=6380

logging.level.org.springframework.security=TRACE

# JWT Secret (Should be moved to environment variables in production)
jwt.secret=aomaoi_super_secret_key_for_farm_accounting_system_make_it_long
jwt.expiration=86400000
