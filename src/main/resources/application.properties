server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:aomaoi_db}
spring.datasource.username=${DB_USER:aomaoi_user}
spring.datasource.password=${DB_PASSWORD:aomaoi_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
logging.level.org.springframework.security=TRACE
jwt.secret=${JWT_SECRET:aomaoi_super_secret_key_for_farm_accounting_system_make_it_long}
jwt.expiration=${JWT_EXPIRATION:86400000}
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG
spring.liquibase.enabled=true
