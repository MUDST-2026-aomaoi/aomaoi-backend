server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
logging.level.org.springframework.boot.autoconfigure.liquibase=INFO
spring.liquibase.enabled=true
app.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:1234}
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.demo-data=${APP_SEED_DEMO_DATA:false}
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.timeout=5s
spring.application.name=aomaoi-backend
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
logging.pattern.level=%5p [traceId=%X{traceId:-} spanId=%X{spanId:-}]
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %p [traceId=%X{traceId:-} spanId=%X{spanId:-}] [%thread] %logger{36} - %m%n
management.metrics.tags.application=${spring.application.name}
app.e2e.support-key=${E2E_SUPPORT_KEY:}

# End-of-day summary e-mail to farm admins. Off unless explicitly enabled and SMTP is configured.
app.business-zone=${APP_BUSINESS_ZONE:Asia/Bangkok}
app.daily-summary.enabled=${DAILY_SUMMARY_ENABLED:false}
app.attendance.closing-time=${ATTENDANCE_CLOSING_TIME:18:00}
app.attendance.close-day.enabled=${ATTENDANCE_CLOSE_DAY_ENABLED:false}
app.daily-summary.cron=${DAILY_SUMMARY_CRON:0 0/15 18-20 * * *}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
management.health.mail.enabled=false
