databaseChangeLog:
  - changeSet:
      id: 003-create-worker
      author: aomaoi
      changes:
        - createTable:
            tableName: worker
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
              - column:
                  name: nickname
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(255)
              - column:
                  name: avatar
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(255)
                  defaultValue: "active"
              - column:
                  name: farm_id
                  type: VARCHAR(255)
              - column:
                  name: joined_date
                  type: DATE
              - column:
                  name: user_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: worker
            baseColumnNames: user_id
            constraintName: fk_worker_user
            referencedTableName: users
            referencedColumnNames: id
