databaseChangeLog:
  - changeSet:
      id: 004-create-admin-profile
      author: aomaoi
      changes:
        - createTable:
            tableName: admin_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(255)
              - column:
                  name: farm_id
                  type: VARCHAR(255)
              - column:
                  name: avatar
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(255)
                  defaultValue: "pending"
              - column:
                  name: joined_date
                  type: DATE
              - column:
                  name: user_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: admin_profile
            baseColumnNames: user_id
            constraintName: fk_admin_profile_user
            referencedTableName: users
            referencedColumnNames: id
