databaseChangeLog:
  - changeSet:
      id: 006-create-audit-logs
      author: aomaoi
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: performed_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: target_user
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: TEXT
